name: MyFirstPlugin
version: '${version}'

main: me.example.myFirstPlugin.MyFirstPlugin
api-version: '26.3'
load: POSTWORLD

commands:
  heal:
    description: Heilt den Spieler
    usage: /heal
  gethammer:
    description: Gibt dir Thors Hammer.
    permission: meinplugin.hammer
  dome:
    description: Steuert die PvP-Arena
    usage: /dome <start|join|stop>
  permissions:
    myfirstplugin.dome.admin:
      description: PvP-Runden verwalten
      default: op
  zonemap:
    description: Gibt dir die Zonen-Karte.